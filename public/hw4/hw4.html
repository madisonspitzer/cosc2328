<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutureWeb 2026</title>
    <link rel="stylesheet" href="css/hw4.css">
</head>

<body>

    <header>
        <h1>FutureWeb 2026</h1>
        <p>Connect, learn, and explore the future of web development.</p>
    </header>

    <main class="container">

        <div class="event-info">
            <h2>Event Details</h2>

            <ul>
                <li>Date: October 15, 2026</li>
                <li>Location: Austin, Texas</li>
                <li>Speakers: Web developers and technology professionals</li>
            </ul>

            <img src="images/event.png" alt="FutureWeb 2026 conference">
        </div>

        <div class="registration-form">

            <form action="https://httpbin.org/post"
                  method="post"
                  enctype="multipart/form-data">

                <fieldset>
                    <legend>Attendee Details</legend>

                    <label for="name">Name</label>
                    <input type="text"
                           id="name"
                           name="name"
                           required>

                    <label for="email">Email</label>
                    <input type="email"
                           id="email"
                           name="email"
                           required>

                    <label for="arrival">Date of Arrival</label>
                    <input type="date"
                           id="arrival"
                           name="arrival"
                           required>
                </fieldset>

                <fieldset>
                    <legend>Session Preferences</legend>

                    <label for="track">Track Selection</label>

                    <select id="track" name="track">
                        <optgroup label="Frontend">
                            <option>React</option>
                            <option>Vue</option>
                            <option>CSS</option>
                        </optgroup>

                        <optgroup label="Backend">
                            <option>Node.js</option>
                            <option>Python</option>
                            <option>Docker</option>
                        </optgroup>
                    </select>

                    <label for="resume">Upload Resume/Portfolio</label>

                    <input type="file"
                           id="resume"
                           name="resume"
                           accept=".pdf,.docx">
                </fieldset>

                <button type="submit">Register</button>

            </form>

        </div>

    </main>

</body>
</html>
